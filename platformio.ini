; =============================================================================
;  SHT40 Temperature & Humidity Monitor -- ESP32-C3 SuperMini + OLED
; =============================================================================

[env:esp32c3supermini]
platform        = espressif32@7.0.1
board           = esp32-c3-devkitm-1    ; closest official board definition for C3
framework       = arduino
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 460800

build_flags =
    -D ARDUINO_USB_MODE=1              ; enable USB CDC on boot
    -D ARDUINO_USB_CDC_ON_BOOT=1       ; Serial = USB CDC (no adapter needed)

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9
